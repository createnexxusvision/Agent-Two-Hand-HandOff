# Render Blueprint: web app + Render Workflows + Postgres, all in one region so workflow task
# runs reach the database over the private network. Secrets are never stored here: values marked
# `sync: false` are entered once in the Render Dashboard when the Blueprint is created.

envVarGroups:
  - name: handoff-shared
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PRIVACY
        value: "off"
      # Workflow task slugs are "<workflow slug>/<task name>"; check the slug on a task's page in the Dashboard.
      - key: HANDOFF_WORKFLOW_SLUG
        value: handoff-workflows
      # 32 random bytes each, generated by Render once. They wrap stored addresses and derive the signing keys.
      - key: TRUST_MASTER_KEY
        generateValue: true
      - key: TRUST_SIGNING_SEED
        generateValue: true

databases:
  - name: handoff-db
    region: oregon
    postgresMajorVersion: "17"

services:
  - type: web
    name: agent-two-hand-handoff
    runtime: node
    region: oregon
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter web build
    startCommand: corepack pnpm --filter web start
    healthCheckPath: /api/health
    envVars:
      - fromGroup: handoff-shared
      - key: DATABASE_URL
        fromDatabase:
          name: handoff-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GATE_PAYEE_EMAIL_1
        sync: false
      - key: GATE_PAYEE_EMAIL_2
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      # A Render API key lets the web app start workflow runs. Leave it empty to run every step in-process.
      - key: RENDER_API_KEY
        sync: false
      # PAYPAL_WEBHOOK_ID is added in the Dashboard after the webhook is registered with PayPal.

  - type: workflow
    name: handoff-workflows
    runtime: node
    region: oregon
    buildCommand: corepack pnpm install --frozen-lockfile
    startCommand: corepack pnpm --filter workflows start
    envVars:
      - fromGroup: handoff-shared
      - key: DATABASE_URL
        fromDatabase:
          name: handoff-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        fromService:
          name: agent-two-hand-handoff
          type: web
          envVarKey: PAYPAL_CLIENT_ID
      - key: PAYPAL_CLIENT_SECRET
        fromService:
          name: agent-two-hand-handoff
          type: web
          envVarKey: PAYPAL_CLIENT_SECRET
      - key: GATE_PAYEE_EMAIL_1
        fromService:
          name: agent-two-hand-handoff
          type: web
          envVarKey: GATE_PAYEE_EMAIL_1
      - key: GATE_PAYEE_EMAIL_2
        fromService:
          name: agent-two-hand-handoff
          type: web
          envVarKey: GATE_PAYEE_EMAIL_2
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        fromService:
          name: agent-two-hand-handoff
          type: web
          envVarKey: GOOGLE_GENERATIVE_AI_API_KEY
